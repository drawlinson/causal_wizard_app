[pytest]
# Lets `import causalwizard` resolve regardless of cwd/invocation style -
# the package isn't pip-installed (see tests/README.md), just a plain
# directory next to this file.
pythonpath = .
testpaths = tests
# Noise from dependencies (pydot/dowhy's own internals), not from
# causalwizard - the notebooks themselves already silence these the same
# way (`warnings.filterwarnings("ignore")` in their first real cell).
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
    ignore::RuntimeWarning
